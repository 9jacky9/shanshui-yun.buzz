<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="100%" height="100%" role="img" aria-label="山水云青绿山水云峦跨境专线流光动态插画">
  <defs>
    <!-- Rice-paper background gradient -->
    <linearGradient id="skyPaper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5F1E6" />
      <stop offset="55%" stop-color="#ECE6D6" />
      <stop offset="100%" stop-color="#E2DAC6" />
    </linearGradient>

    <!-- Distant Ink Mountain Gradient -->
    <linearGradient id="distantPeak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6B8E88" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#DFD9C8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Midground Verdigris Mountain (石绿青峦) -->
    <linearGradient id="midPeak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A6F68" stop-opacity="0.88" />
      <stop offset="65%" stop-color="#3F8279" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#E6E0D0" stop-opacity="0.15" />
    </linearGradient>

    <!-- Foreground Deep Pine Ink Mountain (苍松墨峦) -->
    <linearGradient id="forePeak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C2421" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#254B46" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#2A6F68" stop-opacity="0.4" />
    </linearGradient>

    <!-- Gold & Cinnabar Sun Glow -->
    <radialGradient id="cinnabarSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C84B31" stop-opacity="0.88" />
      <stop offset="65%" stop-color="#D97254" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#C84B31" stop-opacity="0" />
    </radialGradient>

    <!-- Luminous Fiber Stream Gradient -->
    <linearGradient id="streamGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B88B4A" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#E5B96F" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#2A6F68" stop-opacity="0.8" />
    </linearGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cross-border optical paths across mountain passes -->
    <path id="routeUpper" d="M 60,340 C 190,220 310,160 450,210 C 560,250 650,150 740,130" fill="none" />
    <path id="routeMiddle" d="M 60,340 C 210,360 350,260 470,290 C 590,320 660,240 740,260" fill="none" />
    <path id="routeLower" d="M 60,340 C 180,430 380,410 530,360 C 630,330 690,375 740,365" fill="none" />
  </defs>

  <style>
    .mist-band {
      opacity: 0.68;
    }
    .route-dash {
      stroke-dasharray: 8 6;
      animation: flowDash 12s linear infinite;
    }
    .node-label {
      font-family: "Songti SC", "Noto Serif SC", serif;
      font-size: 13px;
      fill: #1C2421;
      font-weight: 700;
    }
    .node-sub {
      font-family: "PingFang SC", sans-serif;
      font-size: 10px;
      fill: #2A6F68;
    }
    @keyframes flowDash {
      from { stroke-dashoffset: 140; }
      to { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Background Rice Paper Canvas -->
  <rect width="800" height="540" fill="url(#skyPaper)" />

  <!-- Subtle Oriental Grid Texture Lines -->
  <g stroke="#CFC7B4" stroke-width="0.6" opacity="0.45">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="160" y1="0" x2="160" y2="540" />
    <line x1="320" y1="0" x2="320" y2="540" />
    <line x1="480" y1="0" x2="480" y2="540" />
    <line x1="640" y1="0" x2="640" y2="540" />
  </g>

  <!-- Cinnabar Rising Sun with Breathing Pulse -->
  <g transform="translate(610, 125)">
    <circle cx="0" cy="0" r="64" fill="url(#cinnabarSun)">
      <animate attributeName="r" values="60;72;60" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="34" fill="#C84B31" opacity="0.82">
      <animate attributeName="opacity" values="0.75;0.92;0.75" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Traditional Vertical Calligraphic Watermark in Top Left -->
  <g transform="translate(42, 42)" opacity="0.78">
    <rect x="0" y="0" width="28" height="84" rx="2" fill="#C84B31" />
    <text x="14" y="24" text-anchor="middle" fill="#F7F5F0" font-family="serif" font-size="13" font-weight="700">山水</text>
    <text x="14" y="46" text-anchor="middle" fill="#F7F5F0" font-family="serif" font-size="13" font-weight="700">云联</text>
    <text x="14" y="68" text-anchor="middle" fill="#F7F5F0" font-family="serif" font-size="13" font-weight="700">印信</text>
    <text x="42" y="24" fill="#4E5954" font-family="serif" font-size="13" letter-spacing="3">千里江山 · 瞬息同频</text>
    <text x="42" y="46" fill="#2A6F68" font-family="sans-serif" font-size="11" letter-spacing="1">IEPL 跨境全光内网专线拓扑图</text>
  </g>

  <!-- Layer 1: Distant Mountain Peaks -->
  <path d="M 0,320 L 75,235 L 145,275 L 245,145 L 340,240 L 430,165 L 535,230 L 635,130 L 735,205 L 800,170 L 800,540 L 0,540 Z" fill="url(#distantPeak)" />

  <!-- Animated Drifting Mist Layer 1 (Back) -->
  <g class="mist-band" filter="url(#softBlur)">
    <path d="M -120,255 Q 40,235 180,255 T 480,248 T 780,258 T 960,248 L 960,295 L -120,295 Z" fill="#F7F5F0" opacity="0.72">
      <animateTransform attributeName="transform" type="translate" values="-60,0; 60,0; -60,0" dur="18s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Layer 2: Midground Verdigris Mountains (青绿主峰) -->
  <path d="M 0,380 L 95,270 L 185,325 L 295,195 L 395,295 L 485,205 L 590,290 L 690,210 L 800,285 L 800,540 L 0,540 Z" fill="url(#midPeak)" />
  <!-- Gold Mineral Ridge Highlight Strokes -->
  <path d="M 95,270 L 185,325 L 295,195 L 395,295 L 485,205 L 590,290 L 690,210" fill="none" stroke="#D7B170" stroke-width="1.6" opacity="0.75" />

  <!-- Animated Drifting Mist Layer 2 (Mid) -->
  <g class="mist-band" filter="url(#softBlur)">
    <path d="M -80,340 Q 110,315 260,340 T 580,330 T 900,345 L 900,390 L -80,390 Z" fill="#F7F5F0" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="50,0; -50,0; 50,0" dur="14s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Layer 3: Foreground Deep Ink Mountains -->
  <path d="M 0,445 L 130,335 L 235,405 L 370,310 L 490,400 L 610,320 L 725,385 L 800,345 L 800,540 L 0,540 Z" fill="url(#forePeak)" />

  <!-- Luminous Cross-Border Stream Routes -->
  <g>
    <!-- Base Glow Lines -->
    <use href="#routeUpper" stroke="url(#streamGlow)" stroke-width="3" opacity="0.85" />
    <use href="#routeMiddle" stroke="url(#streamGlow)" stroke-width="3.5" opacity="0.92" />
    <use href="#routeLower" stroke="url(#streamGlow)" stroke-width="2.5" opacity="0.8" />

    <!-- Animated Flowing Dashes -->
    <use href="#routeUpper" stroke="#F7F5F0" stroke-width="1.4" class="route-dash" opacity="0.75" />
    <use href="#routeMiddle" stroke="#F7F5F0" stroke-width="1.6" class="route-dash" opacity="0.85" />
    <use href="#routeLower" stroke="#F7F5F0" stroke-width="1.2" class="route-dash" opacity="0.7" />
  </g>

  <!-- Animated Light Orbs (灵鹤流光信使) Gliding Across Mountain Passes -->
  <g filter="url(#orbGlow)">
    <!-- Orb 1 on Upper Route (Asia -> North America) -->
    <circle r="5.5" fill="#F7F5F0" stroke="#C84B31" stroke-width="2.5">
      <animateMotion dur="5.5s" repeatCount="indefinite" rotate="auto">
        <mpath href="#routeUpper" />
      </animateMotion>
    </circle>
    <!-- Orb 2 on Middle Route (BGP Core -> Tokyo/Singapore) -->
    <circle r="6" fill="#E8C07A" stroke="#1C2421" stroke-width="2">
      <animateMotion dur="4.2s" repeatCount="indefinite" rotate="auto">
        <mpath href="#routeMiddle" />
      </animateMotion>
    </circle>
    <!-- Orb 3 on Lower Route (Core -> Europe Frankfurt/London) -->
    <circle r="5" fill="#F7F5F0" stroke="#2A6F68" stroke-width="2.5">
      <animateMotion dur="6.4s" repeatCount="indefinite" rotate="auto">
        <mpath href="#routeLower" />
      </animateMotion>
    </circle>
  </g>

  <!-- Key Network Pavilion Relay Hubs (云亭节点) -->
  <!-- Origin Hub: 深港BGP入口 -->
  <g transform="translate(60, 340)">
    <circle r="16" fill="#C84B31" opacity="0.22">
      <animate attributeName="r" values="12;22;12" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle r="7" fill="#C84B31" stroke="#F7F5F0" stroke-width="2" />
    <rect x="-36" y="-44" width="96" height="30" rx="3" fill="#F7F5F0" stroke="#C84B31" stroke-width="1.2" />
    <text x="12" y="-29" text-anchor="middle" class="node-label">深港 IEPL 枢纽</text>
    <text x="12" y="-17" text-anchor="middle" class="node-sub">直连入口 · 0.8ms</text>
  </g>

  <!-- Mid Relay 1: 东京/首尔云亭 -->
  <g transform="translate(450, 210)">
    <circle r="14" fill="#2A6F68" opacity="0.25">
      <animate attributeName="r" values="10;19;10" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle r="6" fill="#2A6F68" stroke="#F7F5F0" stroke-width="2" />
    <rect x="-48" y="-44" width="96" height="30" rx="3" fill="#F7F5F0" stroke="#2A6F68" stroke-width="1.2" />
    <text x="0" y="-29" text-anchor="middle" class="node-label">东亚青峦专线</text>
    <text x="0" y="-17" text-anchor="middle" class="node-sub">东京/首尔 · 26ms</text>
  </g>

  <!-- Mid Relay 2: 狮城/南洋云亭 -->
  <g transform="translate(470, 290)">
    <circle r="6" fill="#B88B4A" stroke="#F7F5F0" stroke-width="2" />
    <rect x="-48" y="12" width="96" height="30" rx="3" fill="#F7F5F0" stroke="#B88B4A" stroke-width="1.2" />
    <text x="0" y="27" text-anchor="middle" class="node-label">南洋碧波节点</text>
    <text x="0" y="39" text-anchor="middle" class="node-sub">新加坡/狮城 · 32ms</text>
  </g>

  <!-- Far Relay 1: 北美硅谷云巅 -->
  <g transform="translate(740, 130)">
    <circle r="15" fill="#C84B31" opacity="0.25">
      <animate attributeName="r" values="10;20;10" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle r="6.5" fill="#C84B31" stroke="#F7F5F0" stroke-width="2" />
    <rect x="-92" y="-15" width="82" height="30" rx="3" fill="#F7F5F0" stroke="#C84B31" stroke-width="1.2" />
    <text x="-51" y="0" text-anchor="middle" class="node-label">硅谷算力中心</text>
    <text x="-51" y="12" text-anchor="middle" class="node-sub">AI 专线 · 118ms</text>
  </g>

  <!-- Far Relay 2: 欧洲法兰克福 -->
  <g transform="translate(740, 365)">
    <circle r="6" fill="#2A6F68" stroke="#F7F5F0" stroke-width="2" />
    <rect x="-94" y="-15" width="84" height="30" rx="3" fill="#F7F5F0" stroke="#2A6F68" stroke-width="1.2" />
    <text x="-52" y="0" text-anchor="middle" class="node-label">欧陆云端大区</text>
    <text x="-52" y="12" text-anchor="middle" class="node-sub">法兰克福 · 136ms</text>
  </g>

  <!-- Bottom Scroll Telemetry Status Bar -->
  <g transform="translate(24, 486)">
    <rect x="0" y="0" width="752" height="36" rx="4" fill="#EFECE4" stroke="#C2B9A7" stroke-width="1" />
    <circle cx="22" cy="18" r="5" fill="#2A6F68">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="22" font-family="serif" font-size="12" fill="#1C2421" font-weight="700">山水云天演路由状态：全线通畅</text>
    <text x="260" y="22" font-family="sans-serif" font-size="11.5" fill="#4E5954">骨干网丢包率：0.00%</text>
    <text x="420" y="22" font-family="sans-serif" font-size="11.5" fill="#4E5954">原生流媒体解锁：100% 绿通</text>
    <text x="605" y="22" font-family="sans-serif" font-size="11.5" fill="#C84B31" font-weight="600">冗余带宽池：80Gbps</text>
  </g>
</svg>
